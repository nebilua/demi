plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.secondbrain.offlinetts'
version = '1.0.0'

android {
  namespace "com.secondbrain.offlinetts"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  compileOnly files("libs/sherpa-onnx-api.jar")
  implementation("org.apache.commons:commons-compress:1.27.1")
}