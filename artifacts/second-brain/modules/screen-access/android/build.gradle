plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.secondbrain.screenaccess'
version = '1.0.0'

dependencies {
  // Apache-2.0 Tesseract, not an operating-system/cloud OCR service.
  implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}

def prepareBundledOcr = tasks.register('prepareBundledOcr', Exec) {
  commandLine 'node', file('../../../scripts/prepare-screen-ocr.js')
}
tasks.named('preBuild').configure { dependsOn prepareBundledOcr }

android {
  namespace "com.secondbrain.screenaccess"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}